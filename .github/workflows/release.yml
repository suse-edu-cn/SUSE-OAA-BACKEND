name: Release & CD

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test:
    name: Pre-release Test & Vet
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Prepare Config
        run: cp configs/config_example.yaml configs/config.yaml

      - name: Run go vet
        run: go vet ./...

      - name: Run Unit Tests
        run: go test -v -race ./...

  build-and-release:
    name: Build & Publish Release
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Build Linux amd64 Binary
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: amd64
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w" -o dist/OAAbeta ./cmd
          cp configs/config_example.yaml dist/
          cd dist
          tar -czvf suse-oaa-backend-${{ github.ref_name }}-linux-amd64.tar.gz OAAbeta config_example.yaml
          sha256sum suse-oaa-backend-${{ github.ref_name }}-linux-amd64.tar.gz > sha256sum.txt

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-package-${{ github.ref_name }}
          path: dist/suse-oaa-backend-${{ github.ref_name }}-linux-amd64.tar.gz
          retention-days: 1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/suse-oaa-backend-${{ github.ref_name }}-linux-amd64.tar.gz
            dist/sha256sum.txt
          generate_release_notes: true

  deploy-self-hosted:
    name: Auto Deploy to Physical Server
    needs: build-and-release
    # 实体机 runner 若配置了 self-hosted 标签即可触发自动更新
    # 增加超时保护，若实体机离线避免无限制排队挂起
    timeout-minutes: 10
    runs-on: [self-hosted, linux]
    steps:
      - name: Deploy Binary to Physical Server
        run: |
          set -euo pipefail
          echo "==> 实体机 Self-Hosted Runner 收到部署指令，开始执行更新..."

          TAG="${{ github.ref_name }}"
          REPO="${{ github.repository }}"
          APP_NAME="OAAbeta"
          INSTALL_DIR="${HOME}/OAA"
          TMP_DIR=$(mktemp -d)
          trap 'rm -rf "${TMP_DIR}"' EXIT

          TAR_NAME="suse-oaa-backend-${TAG}-linux-amd64.tar.gz"
          DOWNLOAD_URL="https://github.com/${REPO}/releases/download/${TAG}/${TAR_NAME}"

          echo "==> 准备部署版本: ${TAG}"
          echo "==> 目标安装目录: ${INSTALL_DIR}"
          mkdir -p "${INSTALL_DIR}"

          # 开始高速获取制品包
          echo "==> 开始高速获取制品包..."
          DOWNLOADED=false

          # 1. 方案 A：尝试 GitHub 官方源多 IP 直连优选 (通过 --resolve 避开机房 DNS 污染)
          OFFICIAL_IPS=(
            "140.82.112.4"
            "140.82.114.4"
            "140.82.113.4"
            "140.82.112.3"
            "140.82.114.3"
            "default"
          )

          for ip in "${OFFICIAL_IPS[@]}"; do
            if [ "${ip}" = "default" ]; then
              echo "==> 尝试官方源 (系统默认解析)..."
              RESOLVE_ARG=()
            else
              echo "==> 尝试官方源直连 (优选 IP: ${ip})..."
              RESOLVE_ARG=(--resolve "github.com:443:${ip}")
            fi

            if curl "${RESOLVE_ARG[@]}" --connect-timeout 8 --max-time 180 -C - -fL -o "${TMP_DIR}/${TAR_NAME}" "${DOWNLOAD_URL}"; then
              echo "✅ 官方源直连下载成功！"
              DOWNLOADED=true
              break
            fi
            echo "⚠️ 当前官方 IP 失败，尝试下一个..."
          done

          # 2. 备用保障：若机房网络无法直连官方 IP，自动无缝切换国内代理镜像并支持断点续传
          if [ "${DOWNLOADED}" != "true" ]; then
            echo "==> 官方直连受阻，自动无缝切换为高速代理镜像源..."
            MIRRORS=(
              "https://gh-proxy.com/${DOWNLOAD_URL}"
              "https://ghfast.top/${DOWNLOAD_URL}"
              "https://mirror.ghproxy.com/${DOWNLOAD_URL}"
            )
            for mirror in "${MIRRORS[@]}"; do
              echo "==> 尝试镜像源: ${mirror}"
              if curl --connect-timeout 10 --max-time 300 -C - -fL -o "${TMP_DIR}/${TAR_NAME}" "${mirror}"; then
                echo "✅ 镜像源下载成功！"
                DOWNLOADED=true
                break
              fi
              echo "⚠️ 当前镜像源失败，尝试下一个..."
            done
          fi

          if [ "${DOWNLOADED}" != "true" ]; then
            echo "❌ 所有下载渠道均已尝试，下载制品包失败！"
            exit 1
          fi

          # 解压并校验
          echo "==> 正在解压制品..."
          tar -zxvf "${TMP_DIR}/${TAR_NAME}" -C "${TMP_DIR}"

          if [ ! -f "${TMP_DIR}/${APP_NAME}" ]; then
            echo "❌ 制品中未找到可执行文件 ${APP_NAME}！"
            exit 1
          fi

          # 备份当前旧版本（如有）
          if [ -f "${INSTALL_DIR}/${APP_NAME}" ]; then
            echo "==> 备份现有可执行文件为 ${APP_NAME}.bak..."
            cp -f "${INSTALL_DIR}/${APP_NAME}" "${INSTALL_DIR}/${APP_NAME}.bak"
          fi

          # 覆盖安装新版本二进制并赋予执行权限
          echo "==> 覆盖安装新版本二进制..."
          mv -f "${TMP_DIR}/${APP_NAME}" "${INSTALL_DIR}/${APP_NAME}"
          chmod +x "${INSTALL_DIR}/${APP_NAME}"

          # 重启服务
          echo "==> 正在触发服务重启..."
          TMUX_SESSION="OAA"
          SERVICE_NAME="suse-oaa"

          if command -v tmux >/dev/null 2>&1 && tmux has-session -t "${TMUX_SESSION}" 2>/dev/null; then
            echo "==> 检测到 tmux 会话 [${TMUX_SESSION}]，发送 Ctrl+C 触发优雅停机..."
            tmux send-keys -t "${TMUX_SESSION}" C-c
            sleep 2

            if tmux has-session -t "${TMUX_SESSION}" 2>/dev/null; then
              echo "==> 会话存活，在 tmux [${TMUX_SESSION}] 窗格中发送启动指令..."
              tmux send-keys -t "${TMUX_SESSION}" "cd ${INSTALL_DIR} && ./${APP_NAME}" Enter
            else
              echo "==> 会话随进程退出已关闭，正在后台新建 tmux [${TMUX_SESSION}] 拉起服务..."
              tmux new-session -d -s "${TMUX_SESSION}" -c "${INSTALL_DIR}" "./${APP_NAME}"
            fi
            echo "✅ 已在 tmux [${TMUX_SESSION}] 窗口中成功重启最新版本！"
          elif command -v systemctl >/dev/null 2>&1 && systemctl is-active --quiet "${SERVICE_NAME}" 2>/dev/null; then
            echo "==> 通过 systemctl 重启 ${SERVICE_NAME} 服务..."
            sudo systemctl restart "${SERVICE_NAME}"
            echo "✅ ${SERVICE_NAME} 服务已平滑重启！"
          else
            echo "ℹ️ 未检测到运行中的 tmux 会话 [${TMUX_SESSION}] 或 systemd 服务 [${SERVICE_NAME}]。"
            echo "   已更新二进制产物至: ${INSTALL_DIR}/${APP_NAME}"
            echo "   若需手动在 tmux 启动，可执行: tmux attach -t ${TMUX_SESSION}"
          fi

          echo "=============================================================================="
          echo "🎉 部署完成！当前运行版本: ${TAG}"
          echo "=============================================================================="
