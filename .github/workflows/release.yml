name: Release & CD

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test:
    name: Pre-release Test & Vet
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Prepare Config
        run: cp configs/config_example.yaml configs/config.yaml

      - name: Run go vet
        run: go vet ./...

      - name: Run Unit Tests
        run: go test -v -race ./...

  build-and-release:
    name: Build & Publish Release
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Build Linux amd64 Binary
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: amd64
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w" -o dist/OAAbeta ./cmd
          cp configs/config_example.yaml dist/
          cd dist
          tar -czvf suse-oaa-backend-${{ github.ref_name }}-linux-amd64.tar.gz OAAbeta config_example.yaml
          sha256sum suse-oaa-backend-${{ github.ref_name }}-linux-amd64.tar.gz > sha256sum.txt

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-package-${{ github.ref_name }}
          path: dist/suse-oaa-backend-${{ github.ref_name }}-linux-amd64.tar.gz
          retention-days: 1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/suse-oaa-backend-${{ github.ref_name }}-linux-amd64.tar.gz
            dist/sha256sum.txt
          generate_release_notes: true
